name: PR Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}

    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write

    steps:
      - name: PR Agent
        id: pragent

        uses: the-pr-agent/pr-agent@main

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          config.model: "openrouter/deepseek/deepseek-chat"

          config.fallback_models: '["openrouter/google/gemini-2.0-flash-lite"]'

          config.custom_model_max_tokens: "8192"

          config.reasoning_effort: "none"

          github_action_config.auto_review: "true"

          github_action_config.auto_describe: "true"

          github_action_config.auto_improve: "true"

          github_action_config.pr_actions: '["opened","reopened","synchronize","ready_for_review"]'